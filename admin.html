<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viajeros Preferentes · Administración V3.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#e9eef7;font-family:Jost,system-ui,sans-serif}.wrap{width:min(1180px,94vw);margin:0 auto;padding:24px 0 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#182a4a,#0b1425);border:1px solid #314c78}.brand b{display:block}.brand small{color:#728199}.card{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:22px;padding:16px}input,select,button{font:inherit;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#0d1829;color:#e9eef7;padding:11px 12px}button{cursor:pointer}button.primary{border-radius:999px;background:linear-gradient(135deg,#28436f,#182d50)}.login{max-width:480px;margin:70px auto}.login-grid{display:grid;gap:9px}#app{display:none}#app.show{display:block}#login.hide{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:220px}.member{margin:10px 0}.member-head{display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:10px;align-items:center}.member-name b{display:block}.member-name small{color:#76859b}.pill{padding:6px 9px;border-radius:999px;background:rgba(123,159,220,.09);border:1px solid rgba(123,159,220,.18);font-size:.72rem}.trip{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}.trip.show{display:block}.form{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:7px}.state-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.state-row button.active{border-color:#81a8e8;color:#bad2fa;background:rgba(83,129,201,.12)}.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.doc{padding:10px;border-radius:15px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.018)}.doc b{display:block;font-size:.8rem;margin-bottom:6px}.doc-row{display:flex;gap:6px}.doc-row select{min-width:0;width:100%}.exp{margin:10px 0}.exp p{color:#98a5b8;line-height:1.45}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{margin-top:8px;color:#8fb3ea;font-size:.82rem}.danger{color:#e39a9a}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{border-radius:999px}.tabpane{display:none}.tabpane.show{display:block}
@media(max-width:800px){.member-head{grid-template-columns:1fr auto}.member-head .hide-mobile{display:none}.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}.docs{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><div class="brand"><div class="logo">✈</div><div><b>Viajeros Preferentes</b><small>Administración · V3.0</small></div></div><button id="logout" onclick="logout()" style="display:none">Cerrar sesión</button></header>
<section class="card login" id="login"><h2>Acceso administrativo</h2><p style="color:#8190a5">Usa el correo registrado en <code>vp_admins</code>.</p><div class="login-grid"><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button class="primary" onclick="login()">Entrar →</button></div><div class="msg" id="loginmsg"></div></section>
<main id="app"><div class="tabs"><button class="primary" onclick="showTab('viajes')">Viajes</button><button onclick="showTab('experiencias')">Experiencias</button></div>
<section id="tab-viajes" class="tabpane show"><div class="toolbar"><input id="search" placeholder="Buscar miembro, Member ID o destino" oninput="renderMembers()"><button onclick="loadAll()">Actualizar</button></div><div id="members"></div></section>
<section id="tab-experiencias" class="tabpane"><div class="toolbar"><button onclick="loadExperiences()">Actualizar experiencias</button></div><div id="experiences"></div></section></main></div>
<script>
const supabaseClient=window.supabase.createClient('https://ohkfwtlsbrhqjhphytua.supabase.co','sb_publishable_zBXlRSgd3hIm7Fqky6Z5Ew_-8cAJPBp');let members=[],experiences=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function msg(id,text,error=false){const el=document.getElementById(id);el.textContent=text||'';el.classList.toggle('danger',error)}
async function login(){msg('loginmsg','Verificando…');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){msg('loginmsg','No pudimos iniciar sesión.',true);return}await openAdmin()}
async function logout(){await supabaseClient.auth.signOut();location.reload()}
async function openAdmin(){try{const {data,error}=await supabaseClient.rpc('vp_es_admin');if(error)throw error;if(!data){msg('loginmsg','Esta cuenta no tiene permiso administrativo.',true);return}document.getElementById('login').classList.add('hide');document.getElementById('app').classList.add('show');document.getElementById('logout').style.display='';await loadAll();await loadExperiences()}catch(e){msg('loginmsg',e.message||'No pudimos abrir administración.',true)}}
function showTab(n){document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('show'));document.getElementById('tab-'+n).classList.add('show')}
async function loadAll(){const {data,error}=await supabaseClient.rpc('vp_admin_lista_miembros_viajes');if(error){alert(error.message);return}members=Array.isArray(data)?data:[];renderMembers()}
function renderMembers(){const q=document.getElementById('search').value.trim().toLowerCase(),box=document.getElementById('members');const filtered=members.filter(m=>[m.nombre,m.member_id,m.email,m.trip?.destino].join(' ').toLowerCase().includes(q));box.innerHTML=filtered.map((m,i)=>memberHtml(m,i)).join('')||'<div class="card">No hay resultados.</div>'}
function memberHtml(m,i){const t=m.trip||{},docs=Array.isArray(m.documents)?m.documents:[];return `<article class="card member"><div class="member-head"><div class="member-name"><b>${esc(m.nombre||'Sin nombre')}</b><small>${esc(m.member_id)} · Academia ${m.academy_percent||0}%</small></div><span class="pill">${esc(t.estado||'Sin viaje')}</span><span class="pill hide-mobile">${esc(m.nivel||'Activo')}</span><button onclick="toggleTrip(${i})">Gestionar</button></div><div class="trip" id="trip-${i}"><div class="form"><input id="dest-${i}" value="${esc(t.destino||'')}" placeholder="Destino"><input id="sal-${i}" type="date" value="${t.fecha_salida||''}"><input id="lle-${i}" type="date" value="${t.fecha_llegada||''}"><input id="ret-${i}" type="date" value="${t.fecha_retorno||''}"><label style="display:flex;align-items:center;gap:5px;font-size:.7rem"><input id="rt-${i}" type="checkbox" ${(docs.find(d=>d.tipo==='rt24')?.aplica)?'checked':''}> RT24</label><button class="primary" onclick="saveTrip('${esc(m.member_id)}',${i})">Guardar viaje</button></div>${t.id?stateButtons(t.id,t.estado):'<p style="color:#728199">Guarda el viaje para habilitar etapas y documentos.</p>'}${t.id?docsHtml(t.id,docs):''}</div></article>`}
function toggleTrip(i){document.getElementById('trip-'+i).classList.toggle('show')}
function stateButtons(id,current){const s=[['cotizando','Cotizando'],['reserva_confirmada','Reserva'],['documentacion_preparacion','Documentación'],['documentacion_lista','Docs listas'],['capacitacion','Capacitación'],['checkin','Check-in'],['en_viaje','En viaje'],['viaje_completado','Completado']];return `<div class="state-row">${s.map(x=>`<button class="${x[0]===current?'active':''}" onclick="setState('${id}','${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function docsHtml(tripId,docs){const order=['boleto','seguro','hotel','itinerario','rt24','checkin'],map=Object.fromEntries(docs.map(d=>[d.tipo,d]));return `<div class="docs">${order.map(tipo=>{const d=map[tipo]||{tipo,etiqueta:tipo,estado:'pendiente',aplica:tipo!=='rt24'};return `<div class="doc"><b>${esc(d.etiqueta||tipo)} ${d.recibido_at?'✓ recibido':''}</b><div class="doc-row"><select onchange="setDoc('${tripId}','${tipo}',this.value,document.getElementById('ap-${tripId}-${tipo}').checked)">${['pendiente','preparando','listo','enviado'].map(x=>`<option value="${x}" ${x===d.estado?'selected':''}>${x}</option>`).join('')}</select><label style="font-size:.7rem;display:flex;align-items:center;gap:4px"><input id="ap-${tripId}-${tipo}" type="checkbox" ${d.aplica!==false?'checked':''}> aplica</label></div></div>`}).join('')}</div>`}
async function saveTrip(memberId,i){const args={p_member_id:memberId,p_destino:document.getElementById('dest-'+i).value.trim()||null,p_fecha_salida:document.getElementById('sal-'+i).value||null,p_fecha_llegada:document.getElementById('lle-'+i).value||null,p_fecha_retorno:document.getElementById('ret-'+i).value||null,p_rt24_aplica:!!document.getElementById('rt-'+i)?.checked};const {error}=await supabaseClient.rpc('vp_admin_guardar_viaje',args);if(error){alert(error.message);return}await loadAll()}
async function setState(id,state){const {error}=await supabaseClient.rpc('vp_admin_cambiar_estado_viaje',{p_trip_id:id,p_estado:state});if(error){alert(error.message);return}await loadAll()}
async function setDoc(id,tipo,state,aplica){const {error}=await supabaseClient.rpc('vp_admin_cambiar_documento',{p_trip_id:id,p_tipo:tipo,p_estado:state,p_aplica:aplica});if(error){alert(error.message);return}await loadAll()}
async function loadExperiences(){const {data,error}=await supabaseClient.rpc('vp_admin_experiencias');if(error){document.getElementById('experiences').innerHTML='<div class="card danger">'+esc(error.message)+'</div>';return}experiences=Array.isArray(data)?data:[];document.getElementById('experiences').innerHTML=experiences.map(expHtml).join('')||'<div class="card">Todavía no hay experiencias.</div>'}
function expHtml(e){return `<article class="card exp"><div class="member-head"><div class="member-name"><b>${esc(e.nombre||e.member_id)}</b><small>${esc(e.destino||'')} · ${'★'.repeat(Math.max(1,Math.min(5,Number(e.rating||5))))}</small></div><span class="pill">${esc(e.estado)}</span></div><p>${esc(e.experiencia)}</p><small style="color:#728199">Autoriza publicación: ${e.autoriza_publicacion?'Sí':'No'} · Valoración: ${e.rating}/5</small>${e.estado==='pendiente_revision'?`<div class="actions"><button class="primary" onclick="resolveExp('${e.id}','publicar')">Publicar</button><button onclick="resolveExp('${e.id}','privada')">Mantener privada</button><button onclick="resolveExp('${e.id}','no_publicar')">No publicar</button></div>`:''}</article>`}
async function resolveExp(id,accion){const {error}=await supabaseClient.rpc('vp_admin_resolver_experiencia',{p_experience_id:id,p_accion:accion,p_nota_admin:null});if(error){alert(error.message);return}await loadExperiences()}
supabaseClient.auth.getSession().then(async({data})=>{if(data?.session)await openAdmin()});
</script></body></html>
